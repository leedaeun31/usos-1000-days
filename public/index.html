<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UsOS — 우리의 작은 우주</title>
    <meta
      name="description"
      content="함께한 1000일을 담은 우리만의 작은 운영체제"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ddd0f4'/%3E%3Ctext x='5' y='25' font-size='26' fill='%23815b83'%3E♥%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <b>♥ UsOS</b><span>우리만의 작은 우주</span
      ><span class="top-right">♡ connected to you <time></time></span>
    </header>
    <main>
      <nav id="desktop" aria-label="바탕화면 앱"></nav>
      <section class="wallpaper">
        <span>OUR LITTLE OPERATING SYSTEM</span>
        <h1>you & me<span>since our first hello.</span></h1>
        <p>함께 쌓아온 날들, 앞으로 채워갈 이야기.</p>
        <div class="badge">♥ &nbsp; 1,000 days of us</div>
      </section>
      <aside class="sticky">
        <small>note to you ↗</small>
        <p>평범한 날도<br />너랑 있으면<br />좋은 날이 돼.</p>
        <span>♡ always, you</span>
      </aside>
      <div id="windows"></div>
      <div class="desktop-footer">
        made with love, a little code & lots of us.
      </div>
    </main>
    <footer>
      <button id="start">♥ UsOS <span>▴</span></button>
      <div id="tasks"></div>
      <span class="tray">♡ 1000 DAYS <span id="clock"></span></span>
    </footer>
    <div id="menu" hidden>
      <b>우리의 작은 공간 ♡</b>
      <div id="menuapps"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
